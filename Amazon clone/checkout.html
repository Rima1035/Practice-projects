<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>checkout of Amazon Clone</title>
    <link rel="stylesheet" href="CSS/checkout.css" />
  </head>
  <body>
    <header>
      <div class="navbar">
        <div class="first-nav">
          <a href="amazon.html">
            <img class="amazon-img" src="images/amazon-logo.png" alt="logo"
          /></a>
        </div>
        <div class="second-nav">
          <div class="checkout-text js-checkoutquantity"></div>
        </div>
        <div class="third-section">
          <img src="images/icons/checkout-lock-icon.png" alt="lock-img" />
        </div>
      </div>
    </header>
    <main>
      <div class="main-content">
        <div class="page-title">Review your order</div>
        <div class="product-grid">
          <div class="products-grid-items">
          <div class="product-items js-product-items">
          </div>
          </div>
          <div class="order-summary">
            <div class="order-details">
              <div class="order-text">Order Summary</div>
              <div class="order-shipping-details">
                <div class="items-values">
                  <span class="item-text">Items (3):</span>
                  <span class="item-price">$42.75</span>
                </div>
                <div class="shipping-details">
                  <span class="shipping-text">Shipping & handling</span>
                  <span class="shipping-price">$4.99</span>
                  
                </div>
              </div>
              <div class="including-tax">
                <div class="tax">
                 <span class="before-tax">Total before Tax:</span>
                  <span class="tax-price1">$47.74</span>
                </div>
                <div class="tax-values">
                <span class="Estimated-tax">Estimated tax (10%):</span>
                  <span class="tax-price">$4.77</span>
                  </div>
              </div>
              </div>
              <div class="final-total">
               <div class="Total">Order total:
              <span class="total-price">$52.51</span>
            </div>
            <button class="place-your-order">Place your order</button>
            </div>
            </div>
          </div>
        </div>
      </div>
    </main>
   
    <script type="module" src="Javascript/checkout.js"></script>
  </body>
</html>
