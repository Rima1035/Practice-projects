<!doctype html>
<html>
  <head>
    <title>Amazon clone</title>
    <link rel="stylesheet" href="CSS/tracking.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <navbar>
      <div class="amazon-header">
        <div class="first-section">
          <div class="header-logo">
            <img src="images/amazon-logo-white.png" />
          </div>
        </div>
        <div class="middle-section">
          <input type="text" placeholder="search" class="middle-section-in" />
          <div class="search">
            <img src="images/icons/search-icon.png" alt="search" />
          </div>
        </div>
        <div class="last-section">
          <div class="last-section-first">
            <a href="orders.html">
              <p>Return</p>
              <p></p>
              <p class="Or">& Orders</p>
            </a>
          </div>
          <div class="last-section-second">
            <a href="checkout.html">
              <img src="images/icons/cart-icon.png" alt="cart-img"
            /></a>
            <div class="cart-quantity">3</div>
            <div class="cart">Cart</div>
          </div>
        </div>
      </div>
    </navbar>
    <main>
      <div class="tracking-details">
        <div class="View-all-orders">
          <a href="orders.html">View all orders</a>
        </div>
        <div class="order-details">
          <div class="arriving-date">Arriving on Monday, June 13</div>
          <div class="product-details">
            Black and Gray Athletic Cotton Socks - 6 Pairs
             <div class="product-quantity">Quantity: 1</div>
          </div>
         
          <div class="product-img">
            <img src="images/products/athletic-cotton-socks-6-pairs.jpg" />
          </div>
        </div>
        <div class="shipping-details">
          <div class="delivery-meter">
            <div class="preparing">Preparing</div>
            <div class="shipped">Shipped</div>
            <div class="Delivered">Delivered</div>
          </div>
          <div class="meter">
            <div class="green-meter"></div>
          </div>
          </div>
      </div>
    </main>
  </body>
</html>
