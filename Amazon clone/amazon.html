<!doctype html>
<html>
  <head>
    <title>Amazon clone</title>
    <link rel="stylesheet" href="CSS/amazon.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    
      <nav>
        <div class="amazon-header">
          <div class="first-section">
            <div class="header-logo">
            <a href="amazon.html">  <img src="images/amazon-logo-white.png" /></a>
            </div>
          </div>
          <div class="middle-section">
            <input type="text" placeholder="search" class="middle-section-in" />
            <div class="search">
              <img src="images/icons/search-icon.png" alt="search" />
            </div>
          </div>
          <div class="last-section">
            <div class="last-section-first">
              <a href="orders.html">
              <p>Return</p>
              <p></p>
              <p class="Or">& Orders</p>
              </a>
            </div>
            <div class="last-section-second">
              <a href="checkout.html">
              <img src="images/icons/cart-icon.png" alt="cart-img" /></a>
              <div class="cart-quantity js-cartquantity">0</div>
              <div class="cart">Cart</div>
            </div>
          </div>
        </div>
      </navbar>

      <div class="main-product">
        <div class="product">
          <img class="socks"
            src="images/products/athletic-cotton-socks-6-pairs.jpg"
            alt="socks"
          />
          <div class="product-text">
            Black and Gray Athletic Cotton Socks - 6 Pairs
          </div>
          <div class="rating">
            <img src="images/ratings/rating-45.png" />
            <div class="rating-number">87</div>
          </div>
          <div class="price">$10.90</div>
          <div class="quantity">
            <select>
              <option selected value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
          </div>
          <button class="add-to-cart">Add to Cart</button>
        </div>
        <div class="product">
         
           <img class="socks"
            src="images/products/intermediate-composite-basketball.jpg"
            alt="socks"
          />
          <div class="product-text">
            Intermediate Size Basketball
          </div>
          <div class="rating">
            <img src="images/ratings/rating-40.png" />
            <div class="rating-number">127</div>
          </div>
          <div class="price">$20.95</div>
          <div class="quantity">
            <select>
              <option selected value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
          </div>
          <button class="add-to-cart">Add to Cart</button>

        </div>
        <div class="product">

         <img class="socks"
            src="images/products/adults-plain-cotton-tshirt-2-pack-teal.jpg"
            alt="socks"
          />
          <div class="product-text">
            Adults Plain Cotton T-Shirt-2 Pack
          </div>
          <div class="rating">
            <img src="images/ratings/rating-45.png" />
            <div class="rating-number">56</div>
          </div>
          <div class="price">$7.99</div>
          <div class="quantity">
            <select>
              <option selected value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
          </div>
          <button class="add-to-cart">Add to Cart</button>
        </div>
      </div>
    </main>
  </body>
</html>
