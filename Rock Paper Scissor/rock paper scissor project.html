<!doctype html>
<html>
  <head>
    <title>Rock Paper and Scissor project in javascript</title>
    <link rel="stylesheet" src="rock paper scissor project.css">
  </head>

  <body>
    <h3>Rock Paper Scissor game with computer</h3>
    <p>
      <button class="element-button"
      onclick="playgame('rock')"><img src="image/rock-emoji.png" height="50px" /></button>

      <button class="element-button"
      onclick="playgame('paper')"><img src="image/paper-emoji.png" height="50px"/></button>

      <button class="element-button"
      onclick="playgame('scissors')"><img src="image/scissors-emoji.png" height="50px"/></button>

      <p class="js-result css-result"></p>
      <p class="js-move css-move"></p>
     
      <p class="js-score css-score1"></p>
      <button class="css-score"
        onclick="
          score.win = 0;
          score.loss = 0;
          score.tie = 0;
           updatescore();
        "
      >
        Reset score
      </button> 
    </p>
    <script src="rock paper scissor project.js"></script>

  </body>
</html>
