<!doctype html>
<html>
  <head>
    <title>Rock Paper and Scissor project in javascript</title>
    <link rel="stylesheet" href="rock paper scissor project.css">
  </head>

  <body>
    <h3>Rock Paper Scissor game with computer</h3>
    <p>
      <button class="element-button js-rockbutton"><img src="image/rock-emoji.png" height="50px" /></button>

      <button class="element-button js-paperbutton"><img src="image/paper-emoji.png" height="50px"/></button>

      <button class="element-button  js-scissorbutton"><img src="image/scissors-emoji.png" height="50px"/></button>

      <p class="js-result css-result"></p>
      <p class="js-move css-move"></p>
     
      <p class="js-score css-score1"></p>
      <button class="css-score js-resetscore" onclick="resetscore()";>
        Reset score
      </button> 
     <p class="js-conformation"></p>
      <button class="js-autoplay css-autoplay">Auto play</button>
    </p>
    <script src="rock paper scissor project.js"></script>
  </body>
</html>
